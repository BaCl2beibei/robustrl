[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-tolerant-migration"
version = "0.1.0"
description = "Single-machine simulator for robust fault-tolerant task migration research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
learning = ["numpy>=1.24", "torch>=2.0", "gymnasium>=0.29"]

[project.scripts]
ftm-run = "ftm.main:main"
ftm-train = "ftm.train_rl:main"
ftm-experiments = "ftm.experiment_suite:main"
ftm-surrogate-data = "ftm.surrogate_dataset:main"
ftm-train-surrogate = "ftm.train_surrogate_robust:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ftm*"]
